name: Android CI and Release

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyAndroidApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # Adjust to match your Android Gradle Plugin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleDebug

      - name: Upload development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: MyAndroidApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build production APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleRelease

      - name: Sign and verify release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Actions secret: $secret"
              exit 1
            fi
          done
          signing_dir=$(mktemp -d)
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$signing_dir/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app-release.apk "$signing_dir/aligned.apk"
          "$build_tools/apksigner" verify app-release.apk

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app-release.apk --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
    permissions:
      contents: write

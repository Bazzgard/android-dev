name: Android CI and Release

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyAndroidApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # Adjust to match your Android Gradle Plugin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleDebug

      - name: Upload development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: MyAndroidApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # The release build must be signed by the Android Gradle project.
      # Configure signingConfig using GitHub Actions secrets before tagging.
      - name: Build production APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleRelease

      - name: Verify signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -not -name '*unsigned*' -print -quit)
          test -n "$APK" || { echo 'No signed release APK found. Configure signingConfig first.'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          cp "$APK" app-release.apk

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app-release.apk --title "$GITHUB_REF_NAME" --generate-notes
        # Requires repository Settings > Actions > General > Workflow permissions:
        # Read and write permissions, or job-level contents: write below.
    permissions:
      contents: write
